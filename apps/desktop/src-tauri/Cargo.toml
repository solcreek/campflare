[package]
name = "campflare-desktop"
version = "0.1.0"
description = "The Campflare app for macOS, Windows and Linux"
edition = "2024"
rust-version = "1.88"

[lib]
name = "campflare_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-opener = "=2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
