[package]
name = "campflare-desktop"
version = "0.1.0"
description = "The Campflare app for macOS, Windows and Linux"
edition = "2024"
rust-version = "1.88"

[lib]
name = "campflare_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-opener = "=2.6.0"
# campflare:// links (permalinks) open the app; see src/lib.rs.
tauri-plugin-deep-link = "=2.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# v1: the Keychain on macOS, the Credential Manager on Windows, the Secret Service (zbus) on Linux.
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }

# A second launch (Windows and Linux hand a deep link to a new process) passes
# its arguments to the running app and exits. Not on macOS, which sends the URL
# to the running app itself.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "=2.5.3", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
